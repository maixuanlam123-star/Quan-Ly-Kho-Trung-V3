<!DOCTYPE html><html lang="vi"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Quản Lý Kho Trứng & Công Nợ</title>    <!-- Tailwind CSS -->    <script src="https://cdn.tailwindcss.com"></script>    <!-- Font Awesome Icons -->    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <!-- Google Fonts Inter -->    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">    <!-- React & ReactDOM -->    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>            <style>        body { font-family: 'Inter', sans-serif; }        ::-webkit-scrollbar { width: 6px; height: 6px; }        ::-webkit-scrollbar-track { background: #f1f5f9; }        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }    </style></head><body class="bg-slate-100 text-slate-800 antialiased min-h-screen">    <div id="root"></div>
    <script>
        const { useState, useEffect, createElement: h } = React;

        const DEFAULT_CATEGORIES = [
            { id: '1', code: 'DTH', name: 'Đỏ TH', unit: 'Quả' },
            { id: '2', code: 'TLT', name: 'Trắng LT', unit: 'Quả' },
            { id: '3', code: 'D20', name: 'Đỏ 20kg', unit: 'Quả' },
            { id: '4', code: 'D19', name: 'Đỏ 19kg', unit: 'Quả' },
            { id: '5', code: 'D18', name: 'Đỏ 18kg', unit: 'Quả' },
            { id: '6', code: 'D17', name: 'Đỏ 17kg', unit: 'Quả' },
            { id: '7', code: 'D16', name: 'Đỏ 16kg', unit: 'Quả' },
            { id: '8', code: 'TQN', name: 'Trắng QN', unit: 'Quả' },
            { id: '9', code: 'TTH', name: 'Trắng TH', unit: 'Quả' },
            { id: '10', code: 'TO', name: 'Trứng trắng to', unit: 'Quả' },
            { id: '11', code: 'NHO', name: 'Trứng trắng nhỏ', unit: 'Quả' }
        ];

        const DEFAULT_SUPPLIERS = [
            { id: '1', name: 'Trại gà Ba Huân', phone: '0903123456', address: 'Bình Chánh, TP.HCM' },
            { id: '2', name: 'Trại trứng Cường Phát', phone: '0918234567', address: 'Đồng Nai' },
            { id: '3', name: 'Công ty Chăn nuôi C.P', phone: '02513836251', address: 'KCN Biên Hòa 2' }
        ];

        const DEFAULT_CUSTOMERS = [
            { id: '1', name: 'Đại lý Minh Hải', phone: '0987654321', address: 'Chợ Đầu Mối Bình Điền' },
            { id: '2', name: 'Siêu thị Bách Hóa Xanh', phone: '19001908', address: 'Toàn quốc' },
            { id: '3', name: 'Tạp hóa Cô Lan', phone: '0933112233', address: 'Quận 8, TP.HCM' }
        ];

        const DEFAULT_STAFFS = [
            { id: '1', name: 'Nguyễn Văn Hùng', code: 'NV01', phone: '0901112233' },
            { id: '2', name: 'Trần Thị Mai', code: 'NV02', phone: '0902223344' },
            { id: '3', name: 'Lê Hoàng Nam', code: 'NV03', phone: '0903334455' }
        ];

        const EXPENSE_CATEGORIES = [
            'Thức ăn chăn nuôi',
            'Gà Hậu Bị',
            'Xây dựng BHM',
            'Xây dựng',
            'Điện mặt trời',
            'Điện, nước, nhiên liệu',
            'Thuốc thú y & Vắc-xin',
            'Lương nhân công',
            'Vận chuyển & Bao bì',
            'Sửa chữa & Vật tư',
            'Chi phí khác'
        ];

        function parseVNNumber(str) {
            if (typeof str === 'number') return Math.round(str);
            if (!str) return 0;
            let clean = str.toString().trim().replace(/\./g, '').replace(/,/g, '');
            const val = parseFloat(clean);
            return isNaN(val) ? 0 : Math.round(val);
        }

        function formatVNNumberInput(val) {
            const num = parseVNNumber(val);
            if (num === 0) return '';
            return num.toLocaleString('vi-VN');
        }

        function generateTicketNo(type, records) {
            const prefix = type === 'nhap' ? 'PN-' : 'PX-';
            let maxNum = 0;
            if (Array.isArray(records)) {
                records.forEach(r => {
                    if (r && r.ticketNo && r.ticketNo.startsWith(prefix)) {
                        const numPart = parseInt(r.ticketNo.replace(prefix, ''), 10);
                        if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                    }
                });
            }
            return `${prefix}${(maxNum + 1).toString().padStart(3, '0')}`;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('khohang');
            const [infoSubTab, setInfoSubTab] = useState('loaihang');

            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('egg_categories')) || DEFAULT_CATEGORIES);
            const [suppliers, setSuppliers] = useState(() => JSON.parse(localStorage.getItem('egg_suppliers')) || DEFAULT_SUPPLIERS);
            const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('egg_customers')) || DEFAULT_CUSTOMERS);
            const [staffs, setStaffs] = useState(() => JSON.parse(localStorage.getItem('egg_staffs')) || DEFAULT_STAFFS);
            const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('egg_records')) || []);
            const [payments, setPayments] = useState(() => JSON.parse(localStorage.getItem('egg_payments')) || []);
            const [expenses, setExpenses] = useState(() => JSON.parse(localStorage.getItem('egg_expenses')) || []);
            const [googleSheetUrl, setGoogleSheetUrl] = useState(() => localStorage.getItem('egg_gsheet_url') || '');

            const [overviewStartDate, setOverviewStartDate] = useState('');
            const [overviewEndDate, setOverviewEndDate] = useState('');

            const [debtStartDate, setDebtStartDate] = useState('');
            const [debtEndDate, setDebtEndDate] = useState('');

            const [expStartDate, setExpStartDate] = useState('');
            const [expEndDate, setExpEndDate] = useState('');

            const [revStartDate, setRevStartDate] = useState('');
            const [revEndDate, setRevEndDate] = useState('');

            const [logFilterStartDate, setLogFilterStartDate] = useState('');
            const [logFilterEndDate, setLogFilterEndDate] = useState('');
            const [logFilterType, setLogFilterType] = useState('all');
            const [logFilterPartner, setLogFilterPartner] = useState('all');
            const [logSearchQuery, setLogSearchQuery] = useState('');

            const [inputMode, setInputMode] = useState('qua');
            const [inputQty, setInputQty] = useState('');
            const [formData, setFormData] = useState({
                id: null,
                ticketNo: '',
                date: new Date().toISOString().split('T')[0],
                itemType: '',
                partner: '',
                staff: '',
                price: '',
                notes: ''
            });

            const [payModal, setPayModal] = useState({ show: false, id: null, date: new Date().toISOString().split('T')[0], partnerName: '', type: 'customer', amount: '', notes: '' });
            const [expForm, setExpForm] = useState({ id: null, date: new Date().toISOString().split('T')[0], category: 'Thức ăn chăn nuôi', amount: '', payee: '', notes: '' });

            const [catForm, setCatForm] = useState({ id: null, code: '', name: '', unit: 'Quả' });
            const [custForm, setCustForm] = useState({ id: null, name: '', phone: '', address: '' });
            const [suppForm, setSuppForm] = useState({ id: null, name: '', phone: '', address: '' });
            const [staffForm, setStaffForm] = useState({ id: null, name: '', code: '', phone: '' });

            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            useEffect(() => { localStorage.setItem('egg_categories', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('egg_suppliers', JSON.stringify(suppliers)); }, [suppliers]);
            useEffect(() => { localStorage.setItem('egg_customers', JSON.stringify(customers)); }, [customers]);
            useEffect(() => { localStorage.setItem('egg_staffs', JSON.stringify(staffs)); }, [staffs]);
            useEffect(() => { localStorage.setItem('egg_records', JSON.stringify(records)); }, [records]);
            useEffect(() => { localStorage.setItem('egg_payments', JSON.stringify(payments)); }, [payments]);
            useEffect(() => { localStorage.setItem('egg_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('egg_gsheet_url', googleSheetUrl); }, [googleSheetUrl]);

            useEffect(() => {
                if (!formData.id && (activeTab === 'nhap' || activeTab === 'xuat')) {
                    const defaultCat = categories.length > 0 ? `${categories[0].code} - ${categories[0].name}` : '';
                    const defaultSupp = suppliers.length > 0 ? suppliers[0].name : '';
                    const defaultCust = customers.length > 0 ? customers[0].name : '';
                    const defaultStaff = staffs.length > 0 ? staffs[0].name : '';

                    let partnerVal = activeTab === 'nhap' ? defaultSupp : defaultCust;

                    setFormData({
                        id: null,
                        ticketNo: generateTicketNo(activeTab, records),
                        date: new Date().toISOString().split('T')[0],
                        itemType: defaultCat,
                        partner: partnerVal,
                        staff: defaultStaff,
                        price: '',
                        notes: ''
                    });
                    setInputQty('');
                }
            }, [activeTab]);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            const syncToGoogleSheet = async (sheetName, rowData) => {
                if (!googleSheetUrl) return;
                try {
                    await fetch(googleSheetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sheetName, rowData })
                    });
                } catch (err) {
                    console.error('Lỗi đồng bộ Google Sheet:', err);
                }
            };

            const handleExportJSON = () => {
                const backupData = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    categories,
                    suppliers,
                    customers,
                    staffs,
                    records,
                    payments,
                    expenses,
                    googleSheetUrl
                };

                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute('href', dataStr);
                downloadAnchor.setAttribute('download', `Backup_KhoTrung_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('Đã sao lưu toàn bộ dữ liệu ra file JSON thành công!');
            };

            const handleImportJSON = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], 'UTF-8');
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed) {
                                if (parsed.categories) setCategories(parsed.categories);
                                if (parsed.suppliers) setSuppliers(parsed.suppliers);
                                if (parsed.customers) setCustomers(parsed.customers);
                                if (parsed.staffs) setStaffs(parsed.staffs);
                                if (parsed.records) setRecords(parsed.records);
                                if (parsed.payments) setPayments(parsed.payments);
                                if (parsed.expenses) setExpenses(parsed.expenses);
                                if (parsed.googleSheetUrl !== undefined) setGoogleSheetUrl(parsed.googleSheetUrl);

                                showToast('Đã khôi phục toàn bộ dữ liệu từ file JSON thành công!');
                            }
                        } catch (err) {
                            showToast('File JSON không hợp lệ hoặc bị lỗi!', 'error');
                        }
                    };
                }
            };

            const calculatedTotalQua = () => {
                const rawVal = parseVNNumber(inputQty);
                return inputMode === 'day' ? rawVal * 300 : rawVal;
            };

            const calculatedTotalPrice = () => {
                return calculatedTotalQua() * parseVNNumber(formData.price);
            };

            const getStockForCategory = (catName, excludeId = null) => {
                const filtered = records.filter(r => r.id !== excludeId);
                const nhap = filtered.filter(r => r.type === 'nhap' && r.itemType === catName).reduce((a, r) => a + r.quantity, 0);
                const xuat = filtered.filter(r => r.type === 'xuat' && r.itemType === catName).reduce((a, r) => a + r.quantity, 0);
                return nhap - xuat;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const ticketNoToUse = formData.ticketNo.trim() || generateTicketNo(activeTab, records);
                const qtyNum = calculatedTotalQua();
                const priceNum = parseVNNumber(formData.price);
                const totalPriceNum = calculatedTotalPrice();

                if (qtyNum <= 0) {
                    showToast('Số lượng phải lớn hơn 0!', 'error');
                    return;
                }

                if (activeTab === 'xuat') {
                    const tonKhoCat = getStockForCategory(formData.itemType, formData.id);
                    if (qtyNum > tonKhoCat) {
                        showToast(`Không thể xuất! Kho chỉ còn ${tonKhoCat.toLocaleString('vi-VN')} quả`, 'error');
                        return;
                    }
                }

                let typeLabel = activeTab === 'nhap' ? 'Nhập' : 'Xuất';

                if (formData.id) {
                    const updatedRecords = records.map(r => r.id === formData.id ? {
                        ...r,
                        ticketNo: ticketNoToUse,
                        date: formData.date,
                        itemType: formData.itemType,
                        inputMode: inputMode,
                        inputQty: parseVNNumber(inputQty),
                        quantity: qtyNum,
                        price: priceNum,
                        totalPrice: totalPriceNum,
                        partner: formData.partner || 'Khách lẻ',
                        staff: formData.staff || 'N/A',
                        notes: formData.notes
                    } : r);
                    setRecords(updatedRecords);
                    showToast(`Đã cập nhật phiếu ${typeLabel} thành công!`);
                    setActiveTab('nhatky');
                } else {
                    const newRecord = {
                        id: Date.now().toString(),
                        ticketNo: ticketNoToUse,
                        date: formData.date,
                        type: activeTab,
                        typeLabel: typeLabel,
                        itemType: formData.itemType,
                        inputMode: inputMode,
                        inputQty: parseVNNumber(inputQty),
                        quantity: qtyNum,
                        price: priceNum,
                        totalPrice: totalPriceNum,
                        partner: formData.partner || 'Khách lẻ',
                        staff: formData.staff || 'N/A',
                        notes: formData.notes
                    };

                    const updatedRecords = [newRecord, ...records];
                    setRecords(updatedRecords);
                    setFormData(prev => ({ ...prev, id: null, ticketNo: generateTicketNo(activeTab, updatedRecords), price: '', notes: '' }));
                    setInputQty('');

                    syncToGoogleSheet(activeTab, [
                        newRecord.ticketNo,
                        newRecord.date,
                        newRecord.typeLabel,
                        newRecord.itemType,
                        newRecord.quantity,
                        newRecord.price,
                        newRecord.totalPrice,
                        newRecord.partner,
                        newRecord.staff,
                        newRecord.notes
                    ]);

                    showToast(`Đã lưu và đồng bộ phiếu ${typeLabel} thành công!`);
                }
            };

            const handleEditRecord = (r) => {
                setActiveTab(r.type);
                setInputMode(r.inputMode || 'qua');
                setInputQty(r.inputQty ? r.inputQty.toString() : r.quantity.toString());
                setFormData({
                    id: r.id,
                    ticketNo: r.ticketNo,
                    date: r.date,
                    itemType: r.itemType,
                    partner: r.partner,
                    staff: r.staff,
                    price: r.price.toString(),
                    notes: r.notes || ''
                });
            };

            const handleSaveExpense = (e) => {
                e.preventDefault();
                const amt = parseVNNumber(expForm.amount);
                if (amt <= 0) {
                    showToast('Số tiền chi phí phải lớn hơn 0!', 'error');
                    return;
                }
                if (expForm.id) {
                    setExpenses(expenses.map(ex => ex.id === expForm.id ? { ...ex, date: expForm.date, category: expForm.category, amount: amt, payee: expForm.payee, notes: expForm.notes } : ex));
                    showToast('Đã cập nhật khoản chi phí!');
                } else {
                    const newEx = {
                        id: Date.now().toString(),
                        date: expForm.date || new Date().toISOString().split('T')[0],
                        category: expForm.category,
                        amount: amt,
                        payee: expForm.payee || 'N/A',
                        notes: expForm.notes || ''
                    };
                    setExpenses([newEx, ...expenses]);
                    syncToGoogleSheet('chiphi', [newEx.date, newEx.category, newEx.amount, newEx.payee, newEx.notes]);
                    showToast('Đã ghi nhận khoản chi phí mới!');
                }
                setExpForm({ id: null, date: new Date().toISOString().split('T')[0], category: 'Thức ăn chăn nuôi', amount: '', payee: '', notes: '' });
            };

            const handleDeleteExpense = (id) => {
                if (confirm('Bạn có chắc chắn muốn xóa khoản chi phí này?')) {
                    setExpenses(expenses.filter(ex => ex.id !== id));
                    showToast('Đã xóa chi phí thành công!');
                }
            };

            const handleSavePayment = (e) => {
                e.preventDefault();
                const payAmount = parseVNNumber(payModal.amount);
                if (payAmount <= 0) {
                    showToast('Số tiền thanh toán phải lớn hơn 0!', 'error');
                    return;
                }

                if (payModal.id) {
                    setPayments(payments.map(p => p.id === payModal.id ? { ...p, date: payModal.date, amount: payAmount, notes: payModal.notes || 'Thanh toán công nợ' } : p));
                    showToast('Đã cập nhật phiếu thanh toán thành công!');
                } else {
                    const newPayment = {
                        id: Date.now().toString(),
                        date: payModal.date || new Date().toISOString().split('T')[0],
                        partnerName: payModal.partnerName,
                        type: payModal.type,
                        amount: payAmount,
                        notes: payModal.notes || 'Thanh toán công nợ'
                    };
                    setPayments([newPayment, ...payments]);

                    syncToGoogleSheet('thanhtoan', [
                        newPayment.date,
                        newPayment.type === 'supplier' ? 'Trả tiền NCC' : 'Thu tiền Khách',
                        newPayment.partnerName,
                        newPayment.amount,
                        newPayment.notes
                    ]);

                    showToast('Đã ghi nhận và đồng bộ thanh toán!');
                }

                setPayModal({ show: false, id: null, date: new Date().toISOString().split('T')[0], partnerName: '', type: 'customer', amount: '', notes: '' });
            };

            const handleDeletePayment = (id) => {
                if (confirm('Bạn có chắc chắn muốn xóa phiếu thanh toán này?')) {
                    setPayments(payments.filter(p => p.id !== id));
                    showToast('Đã xóa phiếu thành công!');
                }
            };

            const handleDeleteRecord = (id) => {
                if (confirm('Bạn có chắc chắn muốn xóa phiếu này?')) {
                    setRecords(records.filter(r => r.id !== id));
                    showToast('Đã xóa phiếu thành công!');
                }
            };

            const handleSaveCategory = (e) => {
                e.preventDefault();
                if (!catForm.code || !catForm.name) return;
                if (catForm.id) {
                    setCategories(categories.map(c => c.id === catForm.id ? catForm : c));
                    showToast('Đã cập nhật loại hàng!');
                } else {
                    setCategories([...categories, { ...catForm, id: Date.now().toString() }]);
                    showToast('Đã thêm loại hàng mới!');
                }
                setCatForm({ id: null, code: '', name: '', unit: 'Quả' });
            };

            const handleSaveCustomer = (e) => {
                e.preventDefault();
                if (!custForm.name) return;
                if (custForm.id) {
                    setCustomers(customers.map(c => c.id === custForm.id ? custForm : c));
                    showToast('Đã cập nhật thông tin khách hàng!');
                } else {
                    setCustomers([...customers, { ...custForm, id: Date.now().toString() }]);
                    showToast('Đã thêm khách hàng mới!');
                }
                setCustForm({ id: null, name: '', phone: '', address: '' });
            };

            const handleSaveSupplier = (e) => {
                e.preventDefault();
                if (!suppForm.name) return;
                if (suppForm.id) {
                    setSuppliers(suppliers.map(s => s.id === suppForm.id ? suppForm : s));
                    showToast('Đã cập nhật nhà cung cấp!');
                } else {
                    setSuppliers([...suppliers, { ...suppForm, id: Date.now().toString() }]);
                    showToast('Đã thêm nhà cung cấp mới!');
                }
                setSuppForm({ id: null, name: '', phone: '', address: '' });
            };

            const handleSaveStaff = (e) => {
                e.preventDefault();
                if (!staffForm.name) return;
                if (staffForm.id) {
                    setStaffs(staffs.map(s => s.id === staffForm.id ? staffForm : s));
                    showToast('Đã cập nhật nhân viên!');
                } else {
                    setStaffs([...staffs, { ...staffForm, id: Date.now().toString() }]);
                    showToast('Đã thêm nhân viên mới!');
                }
                setStaffForm({ id: null, name: '', code: '', phone: '' });
            };

            const filteredRecordsForOverview = records.filter(r => {
                if (overviewStartDate && r.date < overviewStartDate) return false;
                if (overviewEndDate && r.date > overviewEndDate) return false;
                return true;
            });

            const totalNhapQuaFiltered = filteredRecordsForOverview.filter(r => r.type === 'nhap').reduce((a, r) => a + r.quantity, 0);
            const totalXuatQuaFiltered = filteredRecordsForOverview.filter(r => r.type === 'xuat').reduce((a, r) => a + r.quantity, 0);
            const tonKhoQuaFiltered = totalNhapQuaFiltered - totalXuatQuaFiltered;

            const totalGiaTriNhap = filteredRecordsForOverview.filter(r => r.type === 'nhap').reduce((a, r) => a + r.totalPrice, 0);
            const totalGiaTriXuat = filteredRecordsForOverview.filter(r => r.type === 'xuat').reduce((a, r) => a + r.totalPrice, 0);

            const filteredRecordsForDebt = records.filter(r => {
                if (debtStartDate && r.date < debtStartDate) return false;
                if (debtEndDate && r.date > debtEndDate) return false;
                return true;
            });
            const filteredPaymentsForDebt = payments.filter(p => {
                if (debtStartDate && p.date < debtStartDate) return false;
                if (debtEndDate && p.date > debtEndDate) return false;
                return true;
            });

            const supplierDebts = suppliers.map(s => {
                const totalNhap = filteredRecordsForDebt.filter(r => r.type === 'nhap' && r.partner === s.name).reduce((a, r) => a + r.totalPrice, 0);
                const totalPaid = filteredPaymentsForDebt.filter(p => p.type === 'supplier' && p.partnerName === s.name).reduce((a, p) => a + p.amount, 0);
                return { ...s, totalAmount: totalNhap, paidAmount: totalPaid, remaining: totalNhap - totalPaid };
            });

            const customerDebts = customers.map(c => {
                const totalXuat = filteredRecordsForDebt.filter(r => r.type === 'xuat' && r.partner === c.name).reduce((a, r) => a + r.totalPrice, 0);
                const totalPaid = filteredPaymentsForDebt.filter(p => p.type === 'customer' && p.partnerName === c.name).reduce((a, p) => a + p.amount, 0);
                return { ...c, totalAmount: totalXuat, paidAmount: totalPaid, remaining: totalXuat - totalPaid };
            });

            const filteredExpenses = expenses.filter(ex => {
                if (expStartDate && ex.date < expStartDate) return false;
